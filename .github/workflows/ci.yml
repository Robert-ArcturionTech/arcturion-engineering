name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Action setup occurs before isolation; test execution below denies network
      # except the router's explicitly limited synthetic loopback fixture.
      - name: Run synthetic tests in a restricted temporary copy
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d /private/tmp/personal-ci.XXXXXX)
          cp -R "$GITHUB_WORKSPACE/." "$fixture/repo"
          python -m venv "$fixture/venv"
          cd "$fixture/repo"
          sandbox=(/usr/bin/sandbox-exec -f .github/ci/sandbox.sb
            -D "USER_HOME=$HOME" -D "PRIVATE_CONFIG=$HOME/.config"
            -D "PRIVATE_LIBRARY=$HOME/Library" -D "PRIVATE_CLAUDE=$HOME/.claude"
            -D "PRIVATE_CODEX=$HOME/.codex" -D "PRIVATE_SSH=$HOME/.ssh")
          "${sandbox[@]}" env -i PATH="$fixture/venv/bin:/usr/bin:/bin" TMPDIR=/private/tmp PYTHONDONTWRITEBYTECODE=1 /bin/bash run_tests.sh
